[package]
name = "nya"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
nom = "8.0.0"
pgp = "0.20.0"
reqwest = { version = "0.13.4", features = ["stream"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = [
      "rt-multi-thread",
      "macros",
      "fs",
      "io-util",
      "sync",
  ] }
url = "2.5.8"
